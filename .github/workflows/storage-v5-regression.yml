name: Storage V5 Regression

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test Storage V5 Master Data CRUD
        run: npx tsx scripts/testStorageV5MasterDataCrud.ts

      - name: Test Storage V5 Hierarchy CRUD
        run: npx tsx scripts/testStorageV5HierarchyCrud.ts

      - name: Test Storage V5 Hierarchy Delete
        run: npx tsx scripts/testStorageV5HierarchyDelete.ts

      - name: Test Storage V5 Hierarchy Duplicate
        run: npx tsx scripts/testStorageV5HierarchyDuplicate.ts

      - name: Test Storage V5 Annual CRUD
        run: npx tsx scripts/testStorageV5AnnualCrud.ts

      - name: Test Storage V5 Semester CRUD
        run: npx tsx scripts/testStorageV5SemesterCrud.ts

      - name: Test Storage V5 Persistence
        run: npx tsx scripts/testStorageV5Persistence.ts

      - name: Test Storage V5 Relational Integrity
        run: npx tsx scripts/testStorageV5RelationalIntegrity.ts

      - name: Test Storage V5 Runtime Read Model
        run: npx tsx scripts/testRuntimeV5.ts

      - name: Test Storage V5 Contract
        run: npx tsx scripts/testStorageV5Contract.ts

      - name: Test F1 Annual & Semester Scope Contract
        run: npx tsx scripts/testF1AnnualSemesterScopeContract.ts

      - name: Test Merdeka V5 App Shell Contract
        run: npx tsx scripts/testMerdekaV5AppShellContract.ts

      - name: Test Merdeka V5 Annual CP Runtime
        run: npx tsx scripts/testMerdekaV5AnnualCPRuntime.ts

      - name: Test Merdeka CP Analysis Integrity
        run: npx tsx scripts/testMerdekaCPAnalysisIntegrity.ts

      - name: Test Merdeka V5 CP Analysis Runtime
        run: npx tsx scripts/testMerdekaV5CPAnalysisRuntime.ts

      - name: Test Merdeka V5 TP Runtime
        run: npx tsx scripts/testMerdekaV5TPRuntime.ts

      - name: Test Merdeka V5 ATP Runtime
        run: npx tsx scripts/testMerdekaV5ATPRuntime.ts

      - name: Test Merdeka V5 Semester Navigation
        run: npx tsx scripts/testMerdekaV5SemesterNavigation.ts

      - name: Test Calendar Backend Search Provider
        run: npx tsx scripts/testCalendarBackendSearchProvider.ts

      - name: Test Calendar Endpoint Contract
        run: npx tsx scripts/testCalendarEndpointContract.ts

      - name: Test Merdeka V5 Academic Calendar Runtime
        run: npx tsx scripts/testMerdekaV5CalendarRuntime.ts

      - name: Test Calendar JP Integration Regression
        run: npx tsx scripts/testCalendarJpIntegrationRegression.ts

      - name: Test Semester Time Allocation Editor
        run: npx tsx scripts/testSemesterTimeAllocationEditor.ts

      - name: Test Profile School Binding V5
        run: npx tsx scripts/testProfileSchoolBindingV5.ts

      - name: Test Merdeka ATP Annualization Integrity
        run: npx tsx scripts/testMerdekaATPAnnualizationIntegrity.ts

      - name: Test AI Transport Hardening
        run: npx tsx scripts/testAITransportHardening.ts

      - name: Test Development Server Runtime
        run: npx tsx scripts/testDevelopmentServerSmoke.ts

      - name: Test Preview Route Probe
        run: npx tsx scripts/testPreviewRouteProbe.ts

      - name: Run Linter
        run: npm run lint

      - name: Build Production
        run: npm run build

      - name: Run Production Server Smoke Tests
        run: npx tsx scripts/testProductionServerSmoke.ts
